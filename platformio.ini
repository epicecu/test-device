[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = teensy41

[env:teensy41]
platform = platformio/teensy@6.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_flags =
  -D USB_RAWHID
  -D PROGRAMMOR_FIRMWARE_VERSION=1000
  -Wall
  -Wextra
  -Werror=return-type
lib_deps =
  https://github.com/epicecu/corelib.git#750b92d81685cb973d60630884d9e966939b1bc9
  https://github.com/epicecu/table.git#98f8b9a8d5721caeda80860fb6a607480d89c00a
  etlcpp/Embedded Template Library@20.48.1
extra_scripts = pre:support/platformio.py
