[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = teensy41, teensy41-serial

[env]
platform = platformio/teensy@6.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_flags =
  -D PROGRAMMOR_FIRMWARE_VERSION=2000
  -Wall
  -Wextra
  -Werror=return-type
lib_deps =
  https://github.com/epicecu/corelib.git#52c6ab3ca61ca5de71259e53525eae7ef63bbac1
  https://github.com/epicecu/table.git#98f8b9a8d5721caeda80860fb6a607480d89c00a
  etlcpp/Embedded Template Library@20.48.1
extra_scripts = pre:support/platformio.py

[env:teensy41]
build_flags =
  ${env.build_flags}
  -D USB_RAWHID
  -D PROGRAMMOR_TRANSPORT_HID

[env:teensy41-serial]
build_flags =
  ${env.build_flags}
  -D USB_SERIAL
  -D PROGRAMMOR_TRANSPORT_SERIAL
